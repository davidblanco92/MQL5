services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://mql5:mql5@postgres:5432/mql5
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-this-in-production
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mql5
      POSTGRES_USER: mql5
      POSTGRES_PASSWORD: mql5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mql5 -d mql5"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
